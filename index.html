<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171923"><link rel="manifest" href="/manifest.webmanifest"><title>NEXA APK STUDIO</title><style>
*{box-sizing:border-box}body{margin:0;background:#11131a;color:#eef0f5;font:15px system-ui}button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{padding:25px 16px;background:#191c26;border-right:1px solid #343846}.logo{font-size:20px;font-weight:800;margin:4px 8px 32px}.side button{display:block;width:100%;text-align:left;padding:12px;margin:5px 0;border:0;border-radius:9px;background:transparent;color:#c4c9d5}.side button.active,.side button:hover{background:#303543;color:white}.main{min-width:0}.top{height:76px;border-bottom:1px solid #343846;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#1b1e28;border:1px solid #353a48;border-radius:15px;padding:22px;margin:14px 0}.hero{display:flex;justify-content:space-between;align-items:center;padding:32px;background:#252a37}.hero h1{font-size:34px;margin:8px 0}.muted{color:#aeb5c4}.btn{border:0;border-radius:9px;padding:12px 18px;background:#e1e5ee;color:#151821;font-weight:700}.btn.alt{background:transparent;border:1px solid #555d6e;color:#eee}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{font-size:27px;display:block}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;color:#cbd0dc}.form input,.form textarea,.form select{background:#11141c;border:1px solid #424858;color:#fff;border-radius:8px;padding:12px;width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.types button{padding:14px 5px;background:#141720;color:#dce1eb;border:1px solid #454c5c;border-radius:9px}.types button.active{border-color:#fff;background:#303747}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.pill{padding:6px 10px;border-radius:30px;background:#343a49;font-size:12px}.ok{background:#214a38}.bad{background:#542e35}.notice{padding:12px;border:1px solid #596174;border-radius:8px;margin:12px 0;overflow-wrap:anywhere}.hidden{display:none!important}.auth{max-width:440px;margin:9vh auto;padding:30px}.mobile{display:none}@media(max-width:760px){.layout{display:block}.side{display:none}.top{height:65px;padding:0 15px}.wrap{padding:17px 13px 90px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.types{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:27px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#191c26;border-top:1px solid #353a48;justify-content:space-around;padding:8px 2px;z-index:4}.mobile button{background:none;color:#dce1eb;border:0;font-size:11px;padding:5px}.mobile button.active{color:#fff;text-decoration:underline}.hero{padding:22px}}
</style></head><body><div id="app"><section class="auth card"><h1>NEXA APK STUDIO</h1><p class="muted">Convierte tus ideas en aplicaciones Android.</p><p>Conectando…</p></section></div><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const $=s=>document.querySelector(s),app=$('#app');
const cfg={url:import.meta.env?.VITE_SUPABASE_URL,key:import.meta.env?.VITE_SUPABASE_ANON_KEY};
const sb=cfg.url&&cfg.key?createClient(cfg.url,cfg.key):null;
let session=null,tab='home',rows=[],kind='url';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(t){const el=$('#notice');if(el){el.textContent=t;el.classList.remove('hidden')}}
function renderAuth(){app.innerHTML='<section class="auth card"><h1>NEXA APK STUDIO</h1><p class="muted">Convierte tus ideas en aplicaciones Android.</p><form id="auth" class="form"><label>Correo<input id="email" type="email" required></label><label>Contraseña<input id="pass" type="password" minlength="8" required></label><button class="btn">Iniciar sesión</button></form><button class="btn alt" id="signup">Crear cuenta</button> <button class="btn alt" id="google">Google</button><p id="notice" class="notice hidden"></p></section>';$('#auth').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(error)message(error.message)};$('#signup').onclick=async()=>{const{error}=await sb.auth.signUp({email:$('#email').value,password:$('#pass').value});message(error?.message||'Revisa tu correo para confirmar la cuenta.')};$('#google').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}})}
async function load(){if(!session)return;const{data}=await sb.from('builds').select('*').order('created_at',{ascending:false}).limit(50);rows=data||[];render()}
function nav(){return [['home','⌂ Inicio'],['create','＋ Crear APK'],['history','▤ Historial'],['settings','⚙ Configuración'],['account','◉ Mi cuenta'],['help','? Ayuda']].map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+label+'</button>').join('')}
function render(){const done=rows.filter(x=>x.status==='completed').length,pending=rows.filter(x=>['queued','preparing','building'].includes(x.status)).length,failed=rows.filter(x=>x.status==='error').length;app.innerHTML='<div class="layout"><aside class="side"><div class="logo">NEXA APK STUDIO</div>'+nav()+'</aside><main class="main"><header class="top"><b>'+esc(tab.toUpperCase())+'</b><span>'+esc(session.user.email)+'</span></header><div class="wrap">'+(tab==='home'?'<section class="card hero"><div><small>PANEL PRINCIPAL</small><h1>Bienvenido a NEXA</h1><p class="muted">Prepara tu proyecto web y genera una aplicación Android.</p><button class="btn" id="start">Crear APK</button></div><div>▣</div></section><div class="grid">'+[['Compilaciones',rows.length],['Completadas',done],['Pendientes',pending],['Con errores',failed]].map(([a,b])=>'<div class="card stat"><span class="muted">'+a+'</span><strong>'+b+'</strong></div>').join('')+'</div><h3>Actividad reciente</h3>'+list(rows.slice(0,5)):tab==='create'?createForm():tab==='history'?'<h1>Historial</h1>'+list(rows):tab==='settings'?'<h1>Configuración</h1><div class="card"><p>Idioma: Español</p><label><input id="sound" type="checkbox"> Activar sonidos de interfaz</label></div>':tab==='account'?'<h1>Mi cuenta</h1><div class="card">'+esc(session.user.email)+'<p><button id="logout" class="btn alt">Cerrar sesión</button></p></div>':'<h1>Ayuda</h1><div class="card"><p>Necesitas configurar Supabase, GitHub Actions y las variables privadas en Vercel para generar APK reales.</p></div>' )+'<p id="notice" class="notice hidden"></p></div></main></div><nav class="mobile">'+nav()+'</nav>';
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#start')?.addEventListener('click',()=>{tab='create';render()});$('#logout')?.addEventListener('click',async()=>{await sb.auth.signOut()});$('#build')?.addEventListener('submit',submitBuild);document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>download(b.dataset.download));}
function createForm(){return '<h1>Crear APK</h1><form id="build" class="card form"><div class="two"><label>Nombre de la aplicación<input name="app" required maxlength="40" value="Mi aplicación"></label><label>Paquete Android<input name="pkg" required pattern="[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+" value="com.nexa.miapp"></label><label>Versión<input name="version" required pattern="[0-9]+\\.[0-9]+\\.[0-9]+" value="1.0.0"></label><label>Código de versión<input name="code" type="number" min="1" value="1" required></label></div><div class="types">'+[['url','Enlace'],['html','HTML'],['zip','ZIP'],['code','Código']].map(([k,l])=>'<button type="button" data-kind="'+k+'" class="'+(kind===k?'active':'')+'">'+l+'</button>').join('')+'</div>'+(kind==='url'?'<label>Dirección web<input name="url" placeholder="ejemplo.com"></label>':kind==='code'?'<label>Código HTML<textarea name="html" rows="9" placeholder="<!doctype html>"></textarea></label>':'<label>Archivo<input name="file" type="file" accept="'+(kind==='zip'?'.zip,application/zip':'.html,text/html')+'" required></label>')+'<p class="muted">Tamaño máximo de archivo: 50 MB. El APK se compila en GitHub Actions.</p><button class="btn">Generar APK</button></form>'}
async function submitBuild(e){e.preventDefault();const f=new FormData(e.target),appName=f.get('app'),packageName=f.get('pkg'),versionName=f.get('version'),versionCode=Number(f.get('code'));let sourcePath=null,url='';try{if(kind==='url'){url=String(f.get('url')).trim();if(!/^https?:\\/\\//i.test(url))url='https://'+url;new URL(url)}else{let file;if(kind==='code')file=new File([String(f.get('html'))],'index.html',{type:'text/html'});else file=f.get('file');if(!file||!file.size)throw Error('Selecciona un archivo o pega el código HTML.');if(file.size>50*1024*1024)throw Error('El archivo supera 50 MB.');sourcePath=session.user.id+'/'+crypto.randomUUID()+(kind==='zip'?'.zip':'.html');const{error}=await sb.storage.from('sources').upload(sourcePath,file);if(error)throw error}const{data:{session:s}}=await sb.auth.getSession();const r=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({appName,packageName,versionName,versionCode,contentType:kind,sourcePath,url})});const j=await r.json();if(!r.ok)throw Error(j.error||'No se pudo crear el trabajo.');message('Trabajo creado: '+j.id);tab='history';await load()}catch(err){message(err.message)}}
function list(items){if(!items.length)return '<div class="card"><p class="muted">Todavía no hay compilaciones.</p></div>';return items.map(x=>'<div class="card row"><div><b>'+esc(x.app_name)+'</b><div class="muted">'+esc(x.version_name)+' · '+new Date(x.created_at).toLocaleString('es-ES')+'</div>'+(x.error_message?'<small>'+esc(x.error_message)+'</small>':'')+'</div><span class="pill '+(x.status==='completed'?'ok':x.status==='error'?'bad':'')+'">'+esc(x.status)+'</span>'+(x.apk_path?'<button class="btn" data-download="'+esc(x.apk_path)+'">Descargar</button>':'')+'</div>').join('')}
async function download(path){const{data,error}=await sb.storage.from('apks').createSignedUrl(path,90);if(error)return alert(error.message);location.href=data.signedUrl}
if(!sb){app.innerHTML='<section class="auth card"><h1>NEXA APK STUDIO</h1><p>Configura VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY en Vercel para activar la aplicación.</p></section>'}else{sb.auth.getSession().then(({data})=>{session=data.session;session?load():renderAuth()});sb.auth.onAuthStateChange((_e,s)=>{session=s;s?load():renderAuth()});setInterval(()=>{if(session)load()},9000)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));\n</script></body></html>
